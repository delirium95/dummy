services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: dummyjson
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d dummyjson"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/dummyjson
      DUMMYJSON_BASE_URL: https://dummyjson.com
      DUMMYJSON_TIMEOUT_SECONDS: "10"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
